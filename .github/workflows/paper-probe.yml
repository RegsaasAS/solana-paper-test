name: One-hour SOL signal paper test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'signal_test.py'
      - 'test_signal.py'
      - '.github/workflows/paper-probe.yml'
permissions:
  contents: read
concurrency:
  group: sol-paper-probe
  cancel-in-progress: false
jobs:
  paper-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Enforce free-runner scope
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$IS_PRIVATE" = "false" || { echo 'This test is prepared for a public repository only.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signal timing, risk controls and accounting
        run: python3 -m unittest test_signal.py -v
      - name: Screen one fixed signal on live market data
        run: python3 signal_test.py --seconds 3600 --output signal-result
      - name: Retain result in logs and job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('signal-result/result.json')
          if not p.exists():
              raise SystemExit('No result was recorded; test did not complete')
          value = json.loads(p.read_text())
          print(json.dumps(value, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# One-hour forward signal screen, not verified performance\n\n')
              summary.write('```json\n' + json.dumps(value, indent=2) + '\n```\n')
          PY
