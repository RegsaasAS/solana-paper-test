name: Bounded dip rebound paper test
on:
  push:
    branches: [main]
    paths:
      - 'dip_paper.py'
      - 'test_dip_paper.py'
      - '.github/workflows/dip-paper.yml'
permissions:
  contents: read
jobs:
  dip-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Enforce free public runner
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "false"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check causal signals and integer paper accounting
        run: python3 -m unittest test_safe_quote_gate.py test_dip_paper.py -v
      - name: Observe dip rebound hypothesis for 15 minutes
        run: python3 -u dip_paper.py
      - name: Retain result in logs and job summary
        if: always()
        run: |
          if test -f dip-paper-result.json; then
            cat dip-paper-result.json
            echo '### Bounded dip rebound paper result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat dip-paper-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No result file: paper test not verified.'
          fi
